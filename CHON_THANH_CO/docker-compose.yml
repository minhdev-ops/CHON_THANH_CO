# ═══════════════════════════════════════════════════════════════════════
# CHON THANH CO — Docker Compose (production-ready)
# Dịch vụ: app (php-fpm+nginx), mysql, redis
# Chạy: docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════════

services:

  #──────────────────────────────────────────────────────────────────────
  # App — PHP-FPM + Nginx + Supervisor
  #──────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: chonthanhco_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - chonthanhco_net

  #──────────────────────────────────────────────────────────────────────
  # MySQL 8 (dùng cùng image mysql:9.1.0 bạn đang chạy local)
  #──────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:9.1.0
    container_name: chonthanhco_mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chon_thanh_co}
      MYSQL_USER: ${DB_USERNAME:-chon_thanh_co}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chon_thanh_co}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - chonthanhco_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chonthanhco_net

  #──────────────────────────────────────────────────────────────────────
  # Redis (cache, session, queue tùy chọn)
  #──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chonthanhco_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - chonthanhco_redis_data:/data
    networks:
      - chonthanhco_net

networks:
  chonthanhco_net:
    driver: bridge

volumes:
  chonthanhco_mysql_data:
  chonthanhco_redis_data:
